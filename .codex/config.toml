[mcp_servers.moz]
url = "https://mcp-dev.moz.tools/mcp"

[mcp_servers.firefox-devtools]
command = "C:/Windows/System32/cmd.exe"
args = ["/d", "/c", "C:/mozilla-source/firefox/.codex/firefox-devtools.cmd", "--pref", "browser.ml.enable=true", "--enable-script", "--enable-privileged-context"]
cwd = "C:/mozilla-source/firefox"
