<vbox id="custom-fold-dock" class="chromeclass-extrachrome" hidden="true">
  <html:header id="custom-fold-dock-header">
    <html:img id="custom-fold-dock-icon" alt=""/>
    <html:h2 id="custom-fold-dock-title"/>
    <html:button id="custom-fold-dock-close" type="button" data-l10n-id="custom-ui-fold-dock-close"/>
  </html:header>
  <html:nav id="custom-fold-dock-menu" class="custom-archive-panel custom-fold-menu"/>
</vbox>
<splitter id="custom-fold-splitter" class="chromeclass-extrachrome sidebar-splitter" resizebefore="sibling" resizeafter="none" hidden="true" role="separator" aria-controls="custom-fold-dock" data-l10n-id="custom-ui-fold-dock-resize"/>
