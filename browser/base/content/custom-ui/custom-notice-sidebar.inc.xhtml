<html:aside id="custom-notice-sidebar" class="custom-notice custom-notice-small" aria-labelledby="custom-notice-sidebar-title" hidden="true">
  <html:div class="custom-notice-art" aria-hidden="true"></html:div>
  <html:div class="custom-notice-body">
    <html:p class="custom-notice-label"></html:p>
    <html:h2 id="custom-notice-sidebar-title" class="custom-notice-title"></html:h2>
