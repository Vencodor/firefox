<!doctype html>
<html custom-ui="true">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src chrome:; object-src 'none'; script-src chrome:; img-src chrome:; base-uri 'none'; form-action 'none';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title data-l10n-id="agent-chat-title"></title>
    <link
      id="chat-icon"
      rel="icon"
      type="image/svg+xml"
      href="chrome://browser/content/custom-ui/resources/mono/logo/mono-glyph-small.svg"
    />
    <link
      rel="stylesheet"
      href="chrome://browser/content/custom-ui/design-tokens.css"
    />
    <link
      rel="stylesheet"
      href="chrome://browser/content/custom-ui/agent-chat.css"
    />
    <link rel="localization" href="browser/agentChat.ftl" />
    <script
      src="chrome://browser/content/custom-ui/agent-chat.js"
      defer
    ></script>
  </head>
  <body>
    <header class="chat-header">
      <h1 id="chat-title" data-l10n-id="agent-chat-title"></h1>
      <button
        id="chat-new"
        class="chat-icon-button"
        type="button"
        data-l10n-id="agent-chat-new"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 16 16"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M13 9v3.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5H7"
          />
          <path d="m11.4 2.6 2 2L8 10H6V8z" />
        </svg>
      </button>
    </header>

    <main class="chat-conversation">
      <div
        id="chat-messages"
        role="log"
        aria-live="polite"
        aria-relevant="additions text"
        data-l10n-id="agent-chat-messages"
        tabindex="0"
      ></div>
    </main>

    <footer class="chat-composer">
      <div class="chat-floating">
        <button
          id="chat-scroll-end"
          class="chat-glass chat-scroll-end"
          type="button"
          data-l10n-id="agent-chat-scroll-end"
          hidden
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 16 16"
            fill="none"
            aria-hidden="true"
          >
            <path d="M8 3v10M4 9l4 4 4-4" />
          </svg>
        </button>
        <div
          id="chat-activity-status"
          class="chat-glass chat-activity-status"
          hidden
        >
          <span class="chat-activity-status-dot" aria-hidden="true"></span>
          <span
            id="chat-activity-status-label"
            class="chat-activity-status-label"
          ></span>
          <span
            id="chat-activity-status-detail"
            class="chat-activity-status-detail"
          ></span>
        </div>
      </div>
      <form id="chat-form">
        <textarea
          id="chat-input"
          rows="1"
          maxlength="32000"
          spellcheck="true"
          data-l10n-id="agent-chat-input"
          aria-describedby="chat-status"
        ></textarea>
        <div class="chat-composer-actions">
          <div
            id="chat-effort-control"
            class="chat-effort"
            role="radiogroup"
            data-l10n-id="agent-chat-effort"
            data-effort-level="1"
          >
            <span class="chat-effort-indicator" aria-hidden="true"></span>
            <button
              class="chat-effort-option"
              type="button"
              role="radio"
              aria-checked="true"
              data-level="1"
              data-mode="normal"
              data-l10n-id="agent-chat-effort-normal"
            ></button>
            <button
              class="chat-effort-option"
              type="button"
              role="radio"
              aria-checked="false"
              tabindex="-1"
              data-level="2"
              data-mode="deep"
              data-l10n-id="agent-chat-effort-deep"
            ></button>
          </div>
          <button
            id="chat-stop"
            class="chat-submit-button"
            type="button"
            data-l10n-id="agent-chat-stop"
            hidden
          >
            <svg
              width="12"
              height="12"
              viewBox="0 0 12 12"
              fill="currentColor"
              aria-hidden="true"
            >
              <rect x="1" y="1" width="10" height="10" rx="2" />
            </svg>
          </button>
          <button
            id="chat-send"
            class="chat-submit-button"
            type="submit"
            data-l10n-id="agent-chat-send"
            disabled
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 16 16"
              fill="none"
              aria-hidden="true"
            >
              <path d="M8 13V3M4 7l4-4 4 4" />
            </svg>
          </button>
        </div>
      </form>
      <p
        id="chat-status"
        role="status"
        aria-live="polite"
        data-l10n-id="agent-chat-disconnected"
      ></p>
    </footer>
  </body>
</html>
