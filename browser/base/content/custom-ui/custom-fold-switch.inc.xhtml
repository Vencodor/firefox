<html:div id="custom-fold-switch" hidden="">
  <html:div id="custom-fold-switch-track" class="custom-switch" role="tablist" data-l10n-id="custom-ui-fold-switch">
    <html:span class="custom-switch-indicator" aria-hidden="true"/>
    <html:button id="custom-fold-switch-tabs" class="custom-archive-tab" type="button" role="tab" aria-selected="true" data-l10n-id="custom-ui-fold-switch-tabs"/>
    <html:button id="custom-fold-switch-site" class="custom-archive-tab" type="button" role="tab" aria-selected="false" aria-controls="custom-fold" tabindex="-1">
      <html:img id="custom-fold-switch-icon" alt=""/>
    </html:button>
  </html:div>
  <html:button id="custom-fold-dock-button" type="button" hidden=""/>
</html:div>
