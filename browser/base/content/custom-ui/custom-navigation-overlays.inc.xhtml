<html:div id="custom-address-backdrop" hidden="" aria-hidden="true"/>
<html:div id="custom-window-controls-hotspot" aria-hidden="true"/>
<html:div id="custom-window-controls">
  <html:button id="custom-window-minimize" type="button" data-window-command="cmd_minimizeWindow" data-l10n-id="custom-ui-settings-window-minimize">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
      <path d="M3 8h10"/>
    </svg>
  </html:button>
  <html:button id="custom-window-maximize" type="button" data-window-command="cmd_maximizeWindow" data-l10n-id="custom-ui-settings-window-maximize">
    <svg class="custom-maximize-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
      <rect x="3" y="3" width="10" height="10" rx="1"/>
    </svg>
    <svg class="custom-restore-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
      <path d="M5 5V2h9v9h-3M2 5h9v9H2z"/>
    </svg>
  </html:button>
  <html:button id="custom-window-close" type="button" data-window-command="cmd_closeWindow" data-l10n-id="custom-ui-settings-window-close">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
      <path d="m3 3 10 10M3 13 13 3"/>
    </svg>
  </html:button>
</html:div>
