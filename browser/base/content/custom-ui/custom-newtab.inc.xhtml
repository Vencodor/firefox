<html:div id="custom-newtab-surface">
  <html:div class="custom-newtab-content">
    <html:img id="custom-newtab-logo" src="chrome://browser/content/custom-ui/resources/mono/logo/logo-mark.svg" width="56" height="56" alt="" aria-hidden="true" draggable="false"/>
    <html:button id="custom-newtab-run" type="button" data-l10n-id="custom-ui-run-unavailable" disabled="">
      <html:span class="custom-newtab-run-icon" aria-hidden="true"></html:span>
      <html:span class="custom-newtab-run-label">Run</html:span>
    </html:button>
    <html:aside id="custom-notice-newtab" class="custom-notice" aria-labelledby="custom-notice-newtab-title" hidden="true">
      <html:div class="custom-notice-art" aria-hidden="true"></html:div>
      <html:div class="custom-notice-body">
        <html:p class="custom-notice-label"></html:p>
        <html:h2 id="custom-notice-newtab-title" class="custom-notice-title"></html:h2>
        <html:p class="custom-notice-description"></html:p>
      </html:div>
      <html:button class="custom-notice-close" type="button" data-l10n-id="custom-ui-notice-close"></html:button>
    </html:aside>
  </html:div>
</html:div>
