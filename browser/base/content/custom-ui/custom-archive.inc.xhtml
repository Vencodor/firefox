<html:section id="custom-archive" aria-labelledby="custom-archive-title" inert="">
  <html:h2 id="custom-archive-header">
    <html:button id="custom-archive-title" type="button" aria-haspopup="menu" aria-expanded="false">
      <html:span id="custom-archive-title-text" data-l10n-id="custom-ui-archive-title-history"/>
    </html:button>
  </html:h2>
  <html:div id="custom-archive-search" role="search">
    <html:input id="custom-archive-search-input" type="search" autocomplete="off" spellcheck="false" aria-controls="custom-archive" data-l10n-id="custom-ui-archive-search-history"/>
    <html:button id="custom-archive-search-clear" type="button" tabindex="-1" hidden="" data-l10n-id="custom-ui-archive-search-clear"/>
  </html:div>
  <html:div id="custom-archive-history" class="custom-archive-panel" role="region" aria-labelledby="custom-archive-title" tabindex="0">
    <html:section id="custom-archive-closed" class="custom-archive-section" aria-labelledby="custom-archive-closed-title" hidden="">
      <html:h3 id="custom-archive-closed-title" class="custom-archive-heading" data-l10n-id="custom-ui-archive-closed-tabs"/>
      <html:ul class="custom-archive-list"/>
    </html:section>
    <html:div class="custom-archive-sections"/>
    <html:div class="custom-archive-loading" role="status" data-l10n-id="custom-ui-archive-searching" hidden=""/>
    <html:p class="custom-archive-empty" data-l10n-id="custom-ui-archive-history-empty" hidden=""/>
    <html:p class="custom-archive-no-results" data-l10n-id="custom-ui-archive-search-empty" hidden=""/>
  </html:div>
  <html:div id="custom-archive-bookmarks" class="custom-archive-panel" role="region" aria-labelledby="custom-archive-title" tabindex="0" hidden="">
    <html:div class="custom-archive-sections"/>
    <html:p class="custom-archive-empty" data-l10n-id="custom-ui-archive-bookmarks-empty" hidden=""/>
    <html:p class="custom-archive-no-results" data-l10n-id="custom-ui-archive-search-empty" hidden=""/>
  </html:div>
  <html:div id="custom-archive-downloads" class="custom-archive-panel" role="region" aria-labelledby="custom-archive-title" tabindex="0" hidden="">
    <html:ul class="custom-archive-list"/>
    <html:p class="custom-archive-empty" data-l10n-id="custom-ui-archive-downloads-empty" hidden=""/>
    <html:p class="custom-archive-no-results" data-l10n-id="custom-ui-archive-search-empty" hidden=""/>
  </html:div>
  <html:div id="custom-archive-calendar" class="custom-archive-panel" role="region" aria-labelledby="custom-archive-title" tabindex="0" hidden="">
    <html:form id="custom-calendar-composer">
      <html:div id="custom-calendar-input-row">
        <html:span id="custom-calendar-plus" aria-hidden="true"/>
        <html:textarea id="custom-calendar-input" rows="1" spellcheck="false" data-l10n-id="custom-ui-calendar-input"/>
      </html:div>
      <html:div id="custom-calendar-controls">
        <html:button id="custom-calendar-date" class="custom-calendar-chip" type="button" aria-haspopup="menu" aria-expanded="false" aria-pressed="false" data-l10n-id="custom-ui-calendar-date-button">
          <html:span class="custom-calendar-chip-label"/>
        </html:button>
        <html:button id="custom-calendar-time" class="custom-calendar-chip" type="button" aria-haspopup="menu" aria-expanded="false" aria-pressed="false" hidden="" data-l10n-id="custom-ui-calendar-time-button">
          <html:span class="custom-calendar-chip-label"/>
        </html:button>
        <html:button id="custom-calendar-submit" type="submit" disabled="" data-l10n-id="custom-ui-calendar-submit"/>
      </html:div>
    </html:form>
    <html:div class="custom-archive-sections"/>
    <html:p class="custom-archive-empty" data-l10n-id="custom-ui-archive-calendar-empty" hidden=""/>
    <html:p class="custom-archive-no-results" data-l10n-id="custom-ui-archive-search-empty" hidden=""/>
  </html:div>
</html:section>
<html:footer id="custom-archive-footer">
  <html:button id="custom-archive-button" type="button" aria-pressed="false" aria-haspopup="menu" aria-expanded="false" data-l10n-id="custom-ui-archive-button"/>
</html:footer>
