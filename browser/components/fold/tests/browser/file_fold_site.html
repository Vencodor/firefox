<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Fold test site</title>
<style>
  body {
    display: grid;
    grid-template-columns: 240px minmax(0, 1fr);
    min-height: 100vh;
    margin: 0;
  }
  #open-nav {
    position: absolute;
    inset-block-start: 0;
    inset-inline-end: 0;
  }
  #sidebar {
    grid-column: 1;
  }
  main {
    grid-column: 2;
  }
  [role="menu"],
  [role="dialog"] {
    position: absolute;
  }
  #backdrop {
    position: fixed;
    inset: 0;
    background: rgb(0 0 0 / 30%);
  }
</style>
</head>
<body>
<button id="open-nav" aria-label="Open navigation">=</button>
<aside id="sidebar">
  <nav aria-label="Site">
    <div class="search">
      <input type="search" placeholder="Search chats" aria-label="Search chats">
    </div>
    <a href="?view=home"><svg viewBox="0 0 16 16"><path d="M2 8l6-6 6 6v6H2z"/></svg><span>Home</span></a>
    <a href="?view=explore"><span>Explore</span></a>
    <button class="find" aria-label="Find chats"></button>
    <button class="new" aria-label="New chat"><svg viewBox="0 0 16 16"><path d="M8 2v12M2 8h12" stroke="black"/></svg></button>
    <div class="section">
      <button class="section-header" aria-expanded="true"><span class="title">Recent</span></button>
      <button class="filter" aria-label="Filter chats"></button>
      <ul class="items">
        <li class="row"><a href="?view=chat-1">First chat</a><button class="more" aria-label="Options for First chat" aria-haspopup="menu"></button></li>
        <li class="row"><a href="?view=chat-2">Second chat</a><span class="menu-button" aria-haspopup="menu"><button class="more" aria-label="Options for Second chat"></button></span></li>
      </ul>
    </div>
    <div class="section">
      <h3 class="title">Settings</h3>
      <label class="row"><input type="checkbox" id="dark"> Dark theme</label>
    </div>
    <footer class="account"><a href="?view=account">Account</a></footer>
  </nav>
</aside>
<main id="main"><p id="view">home</p></main>
<div id="menu" role="menu" hidden>
  <button role="menuitem" data-action="rename">Rename</button>
  <button role="menuitem" data-action="delete">Delete</button>
</div>
<div id="backdrop" hidden></div>
<div id="find" role="dialog" aria-label="Find chats" hidden>
  <input type="search" aria-label="Find">
  <button id="find-close">Close</button>
</div>
<div id="rename" role="dialog" aria-labelledby="rename-title" hidden>
  <h2 id="rename-title">Rename chat</h2>
  <p>Give the chat a new name.</p>
  <input id="rename-input" aria-label="Chat name">
  <button id="rename-cancel">Cancel</button>
  <button id="rename-save">Save</button>
</div>
<script>
  "use strict";
  let sidebar = document.getElementById("sidebar");
  // Whether the sidebar was drawn while the page was still loading.
  document.body.dataset.sidebarShownAtLoad = String(
    sidebar.checkVisibility({ visibilityProperty: true })
  );

  let menu = document.getElementById("menu");
  let menuTarget = null;
  let rename = document.getElementById("rename");
  let backdrop = document.getElementById("backdrop");
  let renaming = null;

  function chatName(button) {
    return button.closest(".row").querySelector("a").textContent;
  }

  function closeRename() {
    rename.hidden = true;
    backdrop.hidden = true;
    renaming = null;
  }

  function show() {
    let view = new URLSearchParams(location.search).get("view") ?? "home";
    document.getElementById("view").textContent = view;
    for (let link of sidebar.querySelectorAll("a")) {
      if (link.getAttribute("href") == `?view=${view}`) {
        link.setAttribute("aria-current", "page");
      } else {
        link.removeAttribute("aria-current");
      }
    }
  }

  function closeMenu() {
    menu.hidden = true;
    menuTarget?.setAttribute("aria-expanded", "false");
    menuTarget = null;
  }

  document.addEventListener("click", event => {
    let link = event.target.closest("a[href^='?']");
    if (link) {
      event.preventDefault();
      history.pushState(null, "", link.getAttribute("href"));
      show();
      return;
    }
    let header = event.target.closest(".section-header");
    if (header) {
      let expanded = header.getAttribute("aria-expanded") != "true";
      header.setAttribute("aria-expanded", String(expanded));
      header.closest(".section").querySelector(".items").hidden = !expanded;
      return;
    }
    let more = event.target.closest(".more");
    if (more) {
      menuTarget = more;
      more.setAttribute("aria-expanded", "true");
      menu.hidden = false;
      // Whether the menu is drawn as soon as it opens.
      document.body.dataset.menuShownAtOpen = getComputedStyle(menu).visibility;
      return;
    }
    let item = event.target.closest("[role='menuitem']");
    if (item) {
      let name = chatName(menuTarget);
      closeMenu();
      if (item.dataset.action == "rename") {
        renaming = name;
        document.getElementById("rename-input").value = name;
        rename.hidden = false;
        backdrop.hidden = false;
        document.body.dataset.renameShownAtOpen = [rename, backdrop]
          .map(node => getComputedStyle(node).visibility)
          .join(" ");
      } else {
        document.body.dataset.lastAction = `delete ${name}`;
      }
      return;
    }
    if (event.target.id == "rename-save") {
      document.body.dataset.lastAction = `rename ${renaming} to ${
        document.getElementById("rename-input").value
      }`;
      closeRename();
      return;
    }
    if (event.target.id == "rename-cancel") {
      closeRename();
      return;
    }
    if (event.target.closest(".filter")) {
      document.body.dataset.filtered = "true";
      return;
    }
    if (event.target.closest(".find")) {
      document.getElementById("find").hidden = false;
      return;
    }
    if (event.target.id == "find-close") {
      document.getElementById("find").hidden = true;
      return;
    }
    if (event.target.closest(".new")) {
      document.body.dataset.newChat = "true";
    }
  });
  document.addEventListener("keydown", event => {
    if (event.key == "Escape") {
      closeMenu();
      closeRename();
    } else if (event.key == "Enter" && event.target.type == "search") {
      document.body.dataset.searched = event.target.value;
    }
  });
  show();
</script>
</body>
</html>
